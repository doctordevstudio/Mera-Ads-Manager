<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<title>Dr. Dev Control Center</title>
<style>
:root{
  --bg:#070a1f;--bg2:#0d1236;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);
  --text:#eef1ff;--muted:#9aa4d0;--violet:#7c5cff;--cyan:#22d3ee;--pink:#ff4d8d;--amber:#ffb84d;--green:#2fe39a;--red:#ff5470;
  --g1:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);--g2:linear-gradient(135deg,#ff7a59 0%,#ff3d81 100%);--g3:linear-gradient(135deg,#2fe39a,#22d3ee);
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 600px at 10% -10%,#2a1b7a 0%,transparent 60%),
  radial-gradient(800px 600px at 110% 10%,#0b4f7a 0%,transparent 55%),
  radial-gradient(900px 700px at 50% 120%,#5a1550 0%,transparent 55%),var(--bg)}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;animation:float 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#7c5cff;left:-80px;top:12%}
.orb.b{width:300px;height:300px;background:#22d3ee;right:-60px;top:48%;animation-delay:-5s}
.orb.c{width:260px;height:260px;background:#ff4d8d;left:35%;bottom:-90px;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.12)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}50%{box-shadow:0 0 0 12px rgba(124,92,255,0)}}
.up{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pad{padding:20px}

/* buttons + fields */
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:14px;line-height:1;color:var(--text);background:var(--card2);border:1px solid var(--line);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--g1);border-color:transparent;color:#04121f;box-shadow:0 10px 30px rgba(34,211,238,.28)}
.btn.primary:after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.4s infinite}
.btn.warm{background:var(--g2);border-color:transparent;color:#fff;box-shadow:0 10px 30px rgba(255,61,129,.3)}
.btn.danger{color:var(--red);background:rgba(255,84,112,.08);border-color:rgba(255,84,112,.3)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}.btn.big{padding:15px 22px;font-size:16px;width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.btn .sp{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
.field{display:grid;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.field>span small{font-weight:500;opacity:.8}
input,select,textarea{width:100%;background:rgba(5,8,28,.55);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-weight:500;font-size:15px;outline:0;transition:border .2s,box-shadow .2s;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
textarea{min-height:92px;resize:vertical}
input[type=range]{padding:0;height:6px;accent-color:var(--cyan)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--violet)}
select option{background:#0d1236}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:900px){.g3,.g4,.g6{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}.g6.keep2,.g4.keep2{grid-template-columns:repeat(2,1fr)}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid}
.badge.live{color:var(--green);border-color:rgba(47,227,154,.35);background:rgba(47,227,154,.08)}
.badge.expired{color:var(--red);border-color:rgba(255,84,112,.35);background:rgba(255,84,112,.08)}
.badge.revoked{color:var(--amber);border-color:rgba(255,184,77,.35);background:rgba(255,184,77,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:all .2s}
.chip.on{background:var(--g1);color:#04121f;border-color:transparent}
.chip:hover{transform:translateY(-1px)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.switch{position:relative;width:46px;height:26px;flex:none}.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;background:rgba(255,255,255,.18);border-radius:99px;transition:.25s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.25s var(--ease)}
.switch input:checked+i{background:var(--green)}.switch input:checked+i:after{transform:translateX(20px)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:430px;padding:36px 32px;animation:pop .7s var(--ease) both}
.login-card.shake{animation:shake .45s}
.logo{width:74px;height:74px;border-radius:24px;background:var(--g1);display:grid;place-items:center;font-size:38px;margin:0 auto 18px;box-shadow:0 14px 40px rgba(124,92,255,.5);animation:pulse 3s infinite}
.login-card h1{text-align:center;font-size:26px}.login-card p{text-align:center;margin:8px 0 24px}
.login-card form{display:grid;gap:16px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:6px}
.err{color:var(--red);font-weight:600;min-height:20px;text-align:center;font-size:13.5px}
.trust{margin-top:18px;text-align:center;color:var(--muted);font-size:12.5px}
.warn{background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35);color:var(--amber);padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:14px}

/* shell */
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:rgba(7,10,31,.5);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}.brand .logo{width:42px;height:42px;font-size:22px;margin:0;border-radius:14px;animation:none}
.brand b{display:block;font-size:16px}.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);font-weight:600;cursor:pointer;transition:all .25s var(--ease);border:1px solid transparent}
.nav:hover{background:var(--card);color:var(--text);transform:translateX(3px)}
.nav.on{background:linear-gradient(90deg,rgba(124,92,255,.28),rgba(34,211,238,.12));color:#fff;border-color:rgba(124,92,255,.4)}
.nav .ic{font-size:18px;width:22px;text-align:center}
main{padding:28px clamp(16px,3vw,40px) 120px;max-width:1280px;width:100%;min-width:0}
.view{animation:up .5s var(--ease) both}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
@media(max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:40;border-right:0;border-top:1px solid var(--line)}
  .brand,.sidefoot{display:none}.nav{flex-direction:column;gap:2px;padding:8px 10px;font-size:11px}.nav:hover{transform:none}
  main{padding-bottom:130px}
}

/* stats */
.stat{padding:18px;position:relative;overflow:hidden;transition:transform .3s var(--ease)}
.stat:hover{transform:translateY(-4px)}
.stat .n{font-size:34px;font-weight:800;letter-spacing:-.03em}
.stat .l{color:var(--muted);font-size:13px;font-weight:600}
.stat:before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--g1);opacity:.18}
.stat.warm:before{background:var(--g2)}.stat.cool:before{background:var(--g3)}
.nudge{padding:20px;border-radius:var(--r);background:linear-gradient(120deg,rgba(124,92,255,.28),rgba(255,61,129,.2));border:1px solid rgba(255,255,255,.18);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.nudge .e{font-size:34px}

/* table / list */
.tablewrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
tr.hov{transition:background .2s}tr.hov:hover{background:rgba(255,255,255,.04)}
.key{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;font-weight:700}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.acard{padding:18px;cursor:pointer;transition:all .3s var(--ease)}
.acard:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.6);box-shadow:0 24px 60px rgba(124,92,255,.25)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:5px;border-radius:14px;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.tab{padding:10px 18px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.2s}
.tab.on{background:var(--g1);color:#04121f}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--g3);width:0;transition:width 1s var(--ease)}
.bar.hot>i{background:var(--g2)}
.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.camp{padding:18px;display:grid;gap:14px}
.metric{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}.metric b{display:block;font-size:17px}.metric span{font-size:11.5px;color:var(--muted);font-weight:600}
.savebar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);z-index:60;padding:12px 16px;border-radius:16px;display:flex;gap:12px;align-items:center;background:rgba(13,18,54,.92);border:1px solid rgba(124,92,255,.6);box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .45s var(--ease);width:max-content;max-width:calc(100vw - 24px)}
.savebar.show{transform:translateX(-50%);animation:pulse 2.4s infinite}
@media(max-width:820px){.savebar{bottom:88px}}

/* modal + wizard */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(3,5,20,.7);backdrop-filter:blur(8px);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:14px;animation:pop .3s var(--ease) both;overflow-y:auto}
.modal,.wiz{min-width:0}
.grid>*,.split>*{min-width:0}
.modal{width:100%;max-width:560px;padding:24px;max-height:94vh;overflow-y:auto}
.wiz{max-width:1020px;padding:0;display:flex;flex-direction:column;overflow:hidden;height:min(94vh,900px);height:min(94dvh,900px)}
#wizRoot,#edRoot{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.wiz-head,.wiz-foot{flex:none}
@media(max-width:600px){.overlay{padding:8px}.wiz{height:calc(100vh - 16px);height:calc(100dvh - 16px)}.wiz-body{padding:16px}.wiz-head,.wiz-foot{padding-left:16px;padding-right:16px}}
.wiz-head{padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.wiz-body{padding:22px 24px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0;animation:up .45s var(--ease) both}
.wiz-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.steps{display:flex;gap:6px;margin:12px 0 8px}.steps i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.12);transition:.4s}.steps i.done{background:var(--g1)}.steps i.now{background:var(--g2)}
.opt{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:all .25s var(--ease)}
.opt:hover{transform:translateY(-3px)}.opt.on{border-color:var(--cyan);background:rgba(34,211,238,.1);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.split{display:grid;grid-template-columns:1fr 340px;gap:22px}@media(max-width:900px){.split{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(5,8,28,.55)}
.tags input{border:0;background:none;box-shadow:none!important;flex:1;min-width:110px;padding:6px}
.tag{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:99px;background:rgba(124,92,255,.25);font-size:13px;font-weight:600}.tag u{cursor:pointer;text-decoration:none;opacity:.7}
/* facebook-like preview */
.fb{background:#fff;color:#1c1e21;border-radius:14px;overflow:hidden;font:14px/1.4 system-ui,sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.fb .h{display:flex;gap:10px;padding:12px;align-items:center}.fb .av{width:40px;height:40px;border-radius:50%;background:#ddd;overflow:hidden;display:grid;place-items:center;font-weight:700;color:#555}.fb .av img{width:100%;height:100%;object-fit:cover}
.fb .t{padding:0 12px 10px;white-space:pre-wrap;word-break:break-word}.fb .vw{padding:0 26px}.fb video,.fb .vid{width:100%;aspect-ratio:9/16;background:#000;object-fit:contain;display:block}
.fb .lk{display:flex;gap:10px;align-items:center;background:#f0f2f5;padding:10px 12px}.fb .lk b{display:block}.fb .lk .b{margin-left:auto;background:#e4e6eb;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px}
.fb .rx{display:flex;justify-content:space-between;padding:8px 12px;color:#65676b;font-size:13px}.fb .ab{display:flex;border-top:1px solid #e4e6eb}.fb .ab div{flex:1;text-align:center;padding:10px 4px;font-weight:600;color:#65676b;white-space:nowrap;font-size:13px}
#toasts{position:fixed;right:16px;top:16px;z-index:200;display:grid;gap:10px}
.toast{padding:12px 16px;border-radius:14px;background:rgba(13,18,54,.95);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .4s var(--ease) both;font-weight:600;max-width:340px}
.toast.ok{border-color:rgba(47,227,154,.5)}.toast.bad{border-color:rgba(255,84,112,.6)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:300}
.sk{height:84px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<section id="login" hidden>
  <div class="login-card glass" id="loginCard">
    <div class="logo">🤡</div>
    <h1>Welcome back, Dr. Dev</h1>
    <p class="muted">Sign in to manage licenses, test accounts and campaign numbers. Everything is one click away.</p>
    <div id="setupWarn" class="warn" hidden></div>
    <form id="loginForm" autocomplete="on">
      <label class="field"><span>Username</span><input id="lu" name="username" autocomplete="username" value="admin" spellcheck="false"></label>
      <label class="field"><span>Password</span>
        <div class="pw"><input id="lp" name="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button type="button" id="eye" aria-label="Show password">👁</button></div>
      </label>
      <button class="btn primary big" id="loginBtn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="trust">🔒 Encrypted session · signs you out automatically after 12 hours</div>
  </div>
</section>

<div id="app" hidden>
  <aside>
    <div class="brand"><div class="logo">🤡</div><div><b>Dr. Dev</b><span>Control Center</span></div></div>
    <div class="nav on" data-act="nav" data-tab="overview"><span class="ic">✨</span>Overview</div>
    <div class="nav" data-act="nav" data-tab="licenses"><span class="ic">🔑</span>Licenses</div>
    <div class="nav" data-act="nav" data-tab="demo"><span class="ic">🧪</span>Demo data</div>
    <div class="nav" data-act="nav" data-tab="settings"><span class="ic">🛠</span>App control</div>
    <div class="grow"></div>
    <div class="nav sidefoot" data-act="logout"><span class="ic">🚪</span>Sign out</div>
  </aside>
  <main id="main"></main>
</div>

<div class="savebar glass" id="savebar"><span>✏️ You have unsaved changes</span><button class="btn sm" data-act="discard">Discard</button><button class="btn sm primary" data-act="saveDoc">Save changes</button></div>
<div id="toasts"></div>
<div id="layer"></div>
<canvas id="fx"></canvas>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={session:{},ov:null,tab:"overview",demos:[],acct:null,sub:"account",dirty:false,dayRow:null,day:{ci:0,date:""},gen:null,sample:"",open:{},edit:null,editKind:null,editCi:0,editIdx:-1};
let W=null;
let REFRESH=()=>{};
let PVSRC=()=>W&&W.camp.ads[0];
const CUR={INR:"₹",USD:"$",EUR:"€",GBP:"£",AED:"AED ",JPY:"¥",BDT:"৳",PKR:"Rs "};
const money=(n,c="INR")=>(CUR[c]||c+" ")+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const num=n=>Number(n||0).toLocaleString("en-IN");
const OBJ={OUTCOME_LEADS:["🎯","Leads","Get sign-ups or subscribers"],OUTCOME_SALES:["🛍️","Sales","Drive purchases"],OUTCOME_TRAFFIC:["🚀","Traffic","Send people to a website"],OUTCOME_ENGAGEMENT:["💬","Engagement","Get likes, comments, shares"],OUTCOME_AWARENESS:["📣","Awareness","Reach as many people as possible"],OUTCOME_APP_PROMOTION:["📱","App promotion","Get app installs"]};
const RESULTS={subscribe_website:"Website Subscribes",lead:"Leads (website)","onsite_conversion.lead_grouped":"Leads (form)",purchase:"Purchases",landing_page_view:"Landing page views",link_click:"Link clicks",post_engagement:"Post engagements",mobile_app_install:"App installs"};
const RESULT_BY_OBJ={OUTCOME_LEADS:"subscribe_website",OUTCOME_SALES:"purchase",OUTCOME_TRAFFIC:"landing_page_view",OUTCOME_ENGAGEMENT:"post_engagement",OUTCOME_AWARENESS:"link_click",OUTCOME_APP_PROMOTION:"mobile_app_install"};

async function api(path,method="GET",body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=="/admin/login"){showLogin();throw new Error("Please sign in again")}
  if(!r.ok)throw new Error(j.message||("Request failed ("+r.status+")"));
  return j;
}

async function guard(btn,fn){const old=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="sp"></span>'+(btn.dataset.busy||"Working…")}try{return await fn()}catch(e){toast(e.message,"bad")}finally{if(btn){btn.disabled=false;btn.innerHTML=old}}}
function confetti(){
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#7c5cff","#22d3ee","#ff4d8d","#ffb84d","#2fe39a"];
  const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/2.4,vx:(Math.random()-.5)*16,vy:Math.random()*-15-3,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<130)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}
function countUps(){$$("[data-count]").forEach(el=>{const to=+el.dataset.count,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=num(Math.round(to*e));if(k<1)requestAnimationFrame(f)})(t0)})}
function animateBars(){requestAnimationFrame(()=>$$("[data-w]").forEach(b=>b.style.width=b.dataset.w+"%"))}

function resolve(path){const ks=path.split(".");let o=ks[0]==="W"?W:ks[0]==="D"?S.dayRow:ks[0]==="G"?S.gen:ks[0]==="E"?S.edit:S.acct;for(let i=1;i<ks.length-1;i++)o=o[ks[i]];return[o,ks[ks.length-1]]}
const getp=p=>{if(p==="E")return S.edit;const[o,k]=resolve(p);return o[k]};
const setp=(p,v)=>{const[o,k]=resolve(p);o[k]=v};
function markDirty(){S.dirty=true;$("#savebar").classList.add("show")}
function onBind(e){
  const el=e.target.closest("[data-b]");if(!el)return;
  const p=el.dataset.b,t=el.dataset.t;
  let v=el.type==="checkbox"?el.checked:el.value;
  if(t==="n")v=v===""?0:Number(v);else if(t==="nn")v=v===""?null:Number(v);
  setp(p,v);
  if(p.startsWith("acct."))markDirty();
  live(p);
}

let pvT;function live(p){
  if(p.startsWith("acct.doc.opportunity_score")){const s=getp("acct.doc.opportunity_score");$("#ringBox")&&($("#ringBox").innerHTML=ringSVG(s));$("#scoreOut")&&($("#scoreOut").textContent=s)}

}
function lifetime(doc){return doc.campaigns.reduce((a,c)=>a+Object.values(c.daily||{}).reduce((s,r)=>s+(+r.spend||0),0),0)}
function updateSpend(){const d=S.acct.doc,sp=lifetime(d),cap=+d.spend_cap||0,pct=cap>0?Math.min(100,sp/cap*100):0;const b=$("#spendBar");if(b){b.style.width=pct+"%";b.parentElement.classList.toggle("hot",pct>=80)}const o=$("#spendTxt");if(o)o.textContent=cap>0?`${money(sp,d.currency)} of ${money(cap,d.currency)} (${pct.toFixed(0)}%)`:`${money(sp,d.currency)} spent · no limit set`}
function ringSVG(s){const r=42,c=2*Math.PI*r;return`<svg width="96" height="96" viewBox="0 0 100 100"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(100,s))/100)}" style="transition:stroke-dashoffset .8s"/></svg><b>${s}</b>`}

 <div class="grid g3 keep2">${FLD("👍 Likes",a+".reactions.like",{type:"number",t:"n",x:'min="0"'})}${FLD("❤️ Love",a+".reactions.love",{type:"number",t:"n",x:'min="0"'})}${FLD("😆 Haha",a+".reactions.haha",{type:"number",t:"n",x:'min="0"'})}${FLD("💬 Comments",a+".comments",{type:"number",t:"n",x:'min="0"'})}${FLD("↗ Shares",a+".shares",{type:"number",t:"n",x:'min="0"'})}</div></div>`}

function st4(){const g=W.gen,modes=[...(W.mode==="edit"?[["keep","Keep existing numbers","Daily numbers stay exactly as they are"]]:[]),["gen","Generate history","Fill a date range with natural-looking daily numbers"],...(W.mode==="new"?[["zero","Start from zero","Add numbers day by day later"]]:[])];
 return`<div class="grid"><div class="grid g3">${modes.map(m=>`<div class="opt ${g.mode===m[0]?"on":""}" data-act="genMode" data-v="${m[0]}"><b>${m[1]}</b><div class="muted small">${m[2]}</div></div>`).join("")}</div>
 ${g.mode==="gen"?`<div class="grid g4 keep2">${FLD("From","W.gen.start",{type:"date"})}${FLD("To","W.gen.end",{type:"date",x:'max="'+todayIST()+'"'})}${FLD("Total spent ("+cs()+")","W.gen.spend",{type:"number",t:"n"})}${FLD("Total reach","W.gen.reach",{type:"number",t:"n"})}${FLD("Impressions","W.gen.impressions",{type:"number",t:"n"})}${FLD("Link clicks","W.gen.clicks",{type:"number",t:"n"})}${FLD("Unique clicks","W.gen.unique_clicks",{type:"number",t:"n"})}${FLD("Results","W.gen.results",{type:"number",t:"n"})}</div><p class="muted small">The totals are split across the dates and always add up exactly. You can fine-tune every day later in Daily numbers.</p>`:""}</div>`}
function st5(){const c=W.camp,a=c.adsets[0],ad=c.ads[0],o=OBJ[c.objective];
 const row=(k,v)=>`<div class="metric" style="display:flex;justify-content:space-between;gap:12px"><span>${k}</span><b style="font-size:14px;text-align:right">${v}</b></div>`;
 return`<div class="nudge" style="margin-bottom:16px"><div class="e">🎉</div><div class="grow"><h3>${W.mode==="new"?"Ready to launch":"Ready to save"}</h3><div class="muted small">Check the summary, then ${W.mode==="new"?"create the campaign":"save"}. You can change anything later.</div></div></div>
 <div class="grid g2"><div class="grid">${row("Campaign",esc(c.name))}${row("Goal",o[0]+" "+o[1])}${row("Counted result",RESULTS[c.result_action]||"")}${row("Status",c.status)}${row("Daily budget",money(c.daily_budget||a.daily_budget,S.acct.doc.currency))}${row("Schedule",esc(a.start_time)+" → "+esc(a.end_time||"ongoing"))}</div>
 <div class="grid">${row("Audience",esc(a.countries.join(", "))+" · "+a.age_min+"–"+a.age_max+" · "+["All","Men","Women"][a.genders])}${row("Interests",esc(a.interests.join(", ")||"—"))}${row("Placements",a.placements.auto?"Automatic":esc(a.placements.platforms.join(", ")))}${row("Posted as",esc(ad.profile_name||"License name"))}${row("Video",ad.video_url?"✅ added":"—")}${row("Engagement",num((+ad.reactions.like||0)+(+ad.reactions.love||0)+(+ad.reactions.haha||0))+" reactions · "+num(ad.comments)+" comments · "+num(ad.shares)+" shares")}</div></div>`}
function wizRender(){
  const root=$("#wizRoot");if(!root||!W)return;const n=STEPS.length,s=W.step;
  root.innerHTML=`<div class="wiz-head"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><h2>${W.mode==="new"?"Create campaign":"Edit campaign"}</h2><div class="muted small">Step ${s+1} of ${n} · ${STEPS[s]}${s>=3?" · almost there! 🎉":""}</div></div><button class="btn sm" data-act="wizClose">✕</button></div><div class="steps">${STEPS.map((x,i)=>`<i class="${i<s?"done":i===s?"now":""}"></i>`).join("")}</div></div>
  <div class="wiz-body" id="wizBody">${[st0,st1,st2,st3,st4,st5][s]()}</div>
  <div class="wiz-foot"><button class="btn" data-act="wizBack" ${s===0?"disabled":""}>← Back</button><span class="muted small">${Math.round(s/(n-1)*100)}% complete</span>${s<n-1?'<button class="btn primary" data-act="wizNext">Next →</button>':`<button class="btn warm" data-act="wizFinish" data-busy="Saving…">${W.mode==="new"?"🚀 Create campaign":"💾 Save changes"}</button>`}</div>`;
}
function wizCheck(){const c=W.camp,a=c.adsets[0],ad=c.ads[0],s=W.step;
  if(s===0&&!c.name.trim())return"Give the campaign a name";
  if(s===1&&!(a.daily_budget>0)&&!(c.daily_budget>0))return"Enter a daily budget";
  if(s===1&&a.end_time&&a.end_time<a.start_time)return"End date must be after the start date";
  if(s===2&&!a.countries.length)return"Add at least one country, for example IN";
  if(s===2&&a.age_min>a.age_max)return"Minimum age cannot be above maximum age";
  if(s===3&&ad.video_url&&!/^https?:\/\//.test(ad.video_url))return"The video link must start with https://";
  if(s===4&&W.gen.mode==="gen"&&W.gen.end<W.gen.start)return"The end date must be after the start date";
  return""}

/* ---------- app control ---------- */
function viewSettings(){
  const m=S.ov.maintenance;
  $("#main").innerHTML=`<div class="view"><div class="top up"><div><h1>App control</h1><p class="muted" style="margin:6px 0 0">Switch the whole app on or off and unblock devices.</p></div></div>
  <div class="glass pad up" style="--i:1"><h3>🛠 Maintenance mode</h3><p class="muted small">When ON, the app stops working for everyone and shows your message in a dialog.</p>
  <div class="row" style="margin:14px 0"><span class="switch"><input type="checkbox" id="m_on" ${m.maintenance?"checked":""}><i></i></span><b id="m_lbl">${m.maintenance?"ON — the app is disabled":"OFF — the app is online"}</b></div>
  <label class="field"><span>Message shown in the app</span><textarea id="m_msg">${esc(m.message)}</textarea></label>
  <div class="row" style="margin-top:14px"><button class="btn primary" data-act="saveMaint" data-busy="Saving…">Save</button><button class="btn" data-act="unblockAll">Unblock all devices</button></div></div></div>`;
  $("#m_on").onchange=e=>{$("#m_lbl").textContent=e.target.checked?"ON — the app is disabled":"OFF — the app is online"};
}

/* ---------- actions ---------- */
const stripIds=c=>{delete c.id;c.adsets.forEach(a=>delete a.id);c.ads.forEach(a=>{delete a.id;delete a.adset_id});return c};
const ACT={
  nav:el=>go(el.dataset.tab),
  logout:()=>logout(),
  discard:async()=>{S.dirty=false;$("#savebar").classList.remove("show");if(S.acct)await openAcct(S.acct.id)},
  saveDoc:el=>guard(el,async()=>{await saveDoc();if(S.tab==="demo"&&S.acct)viewEditor()}),
  /* licenses */
  mkLicense:el=>guard(el,async()=>{
    const r=await api("/admin/api/licenses","POST",{name:$("#cl_name").value.trim(),avatar_url:$("#cl_img").value.trim(),demo_account:$("#cl_demo").value,valid_until:$("#cl_date").value,count:+$("#cl_cnt").value||1,note:$("#cl_note").value.trim()});
    S.newKeys=r.keys;await loadOverview();viewLicenses();
    const b=$("#newKeys");b.hidden=false;b.innerHTML=`<div class="nudge"><div class="e">🎉</div><div class="grow"><b>${r.keys.length>1?"Your keys are ready":"Your key is ready"}</b><div class="key" style="margin-top:6px;white-space:pre-line">${r.keys.join("\n")}</div></div><button class="btn primary" data-act="copyNew">Copy</button></div>`;confetti()}),
  copyNew:()=>copyText((S.newKeys||[]).join("\n")),
  copyKey:el=>copyText(el.dataset.k),
  editLic:el=>{const l=S.ov.licenses.find(x=>x.key===el.dataset.k);if(!l)return;
    modal(`<h2 style="margin-bottom:16px">Edit license</h2><div class="key muted" style="margin-bottom:14px">${esc(l.key)}</div><div class="grid">
    <label class="field"><span>User name</span><input id="ef_name" value="${esc(l.name)}" maxlength="60"></label>
    <label class="field"><span>Profile icon URL</span><input id="ef_img" value="${esc(l.avatar_url)}"></label>
    <label class="field"><span>Data account</span><select id="ef_demo"><option value="">— None (own Meta account) —</option>${S.ov.demos.map(x=>`<option value="${x.id}" ${x.id===l.demo?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
    <label class="field"><span>Note</span><input id="ef_note" value="${esc(l.note)}" maxlength="60"></label></div>
    <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveLic" data-k="${l.key}" data-busy="Saving…">Save</button></div>`)},
  saveLic:el=>guard(el,async()=>{await api(`/admin/api/licenses/${el.dataset.k}/update`,"POST",{name:$("#ef_name").value,avatar_url:$("#ef_img").value,demo_account:$("#ef_demo").value,note:$("#ef_note").value});closeModal();toast("License updated");await loadOverview();viewLicenses()}),
  closeModal:()=>closeModal(),
  extend:el=>{modal(`<h2 style="margin-bottom:16px">Extend validity</h2><label class="field"><span>New valid-until date</span><input id="ex_date" type="date" value="${addDays(todayIST(),30)}" min="${todayIST()}"></label><div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="doExtend" data-k="${el.dataset.k}">Extend</button></div>`)},
  doExtend:el=>guard(el,async()=>{await api(`/admin/api/licenses/${el.dataset.k}/extend`,"POST",{valid_until:$("#ex_date").value});closeModal();toast("Validity extended");await loadOverview();viewLicenses()}),
  resetDev:el=>{if(confirm("Unbind this key from its device?"))guard(el,async()=>{await api(`/admin/api/licenses/${el.dataset.k}/reset-device`,"POST",{});toast("Device reset");await loadOverview();viewLicenses()})},
  revoke:el=>guard(el,async()=>{await api(`/admin/api/licenses/${el.dataset.k}/revoke`,"POST",{revoked:el.dataset.r==="1"});await loadOverview();viewLicenses()}),
  delLic:el=>{if(confirm("Delete this license permanently?"))guard(el,async()=>{await api(`/admin/api/licenses/${el.dataset.k}`,"DELETE");toast("Deleted");await loadOverview();viewLicenses()})},
  /* demo accounts */
  newDemo:()=>{modal(`<h2 style="margin-bottom:16px">New data account</h2><div class="grid"><label class="field"><span>Name <small>(only you see this)</small></span><input id="nd_name" placeholder="e.g. Cricket channel" maxlength="80"></label>
    <label class="field"><span>Currency</span><select id="nd_cur">${["INR","USD","EUR","GBP","AED"].map(c=>`<option>${c}</option>`).join("")}</select></label>
    <div class="row"><span class="switch"><input type="checkbox" id="nd_sample" checked><i></i></span><div><b>Include sample campaign and numbers</b><div class="muted small">A ready-made campaign with 45 days of data</div></div></div></div>
    <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="mkDemo" data-busy="Creating…">Create</button></div>`)},
  mkDemo:el=>guard(el,async()=>{const r=await api("/admin/api/demo","POST",{name:$("#nd_name").value.trim()||"New account",currency:$("#nd_cur").value,sample:$("#nd_sample").checked});closeModal();toast("Account created ✨");await openAcct(r.id)}),
  openAcct:el=>guard(null,()=>openAcct(el.dataset.id)),
  delAcct:el=>{if(confirm("Delete this data account and all its numbers?"))guard(el,async()=>{await api("/admin/api/demo/"+el.dataset.id,"DELETE");toast("Deleted");await loadDemos();viewDemoList()})},
  back:()=>{if(S.dirty&&!confirm("You have unsaved changes. Leave without saving?"))return;S.dirty=false;$("#savebar").classList.remove("show");S.acct=null;render()},
  sub:el=>{S.sub=el.dataset.s;viewSub()},
  addRec:()=>{S.acct.doc.recommendations.push({type:"New recommendation",body:"",lift:"",points:2});markDirty();subAccount()},
  delRec:el=>{S.acct.doc.recommendations.splice(+el.dataset.i,1);markDirty();subAccount()},
  campStatus:el=>{S.acct.doc.campaigns[+el.dataset.i].status=el.checked?"ACTIVE":"PAUSED";markDirty();subCampaigns()},
  newCamp:()=>openWizard(-1),
  editCamp:el=>openWizard(+el.dataset.i),
  dayFor:el=>{S.day.ci=+el.dataset.i;S.sub="daily";loadDay();viewSub()},
  dupCamp:el=>{const c=clone(S.acct.doc.campaigns[+el.dataset.i]);stripIds(c);c.name+=" (copy)";S.acct.doc.campaigns.push(c);markDirty();subCampaigns();toast("Duplicated — save to keep it")},
  delCamp:el=>{if(confirm("Delete this campaign and its numbers?")){S.acct.doc.campaigns.splice(+el.dataset.i,1);markDirty();subCampaigns()}},
  /* daily */
  dayQuick:el=>{S.day.date=addDays(todayIST(),+el.dataset.n);loadDay();subDaily()},
  pickDay:el=>{S.day.date=el.dataset.d;loadDay();subDaily();scrollTo({top:0,behavior:"smooth"})},
  saveDay:()=>{const c=S.acct.doc.campaigns[S.day.ci];c.daily[S.day.date]={...S.dayRow};markDirty();subDaily();toast("Day updated — press Save changes to send it to the app")},
  delDay:()=>{const c=S.acct.doc.campaigns[S.day.ci];delete c.daily[S.day.date];loadDay();markDirty();subDaily()},
  randDay:()=>{const a=S.acct.doc.campaigns[S.day.ci].adsets[0],base=(a&&a.daily_budget)||1000,r=Math.random,spend=Math.round(base*(.6+r()*.8)*100)/100,imp=Math.round(spend*(9+r()*6)),clicks=Math.round(imp*(.012+r()*.01));
    S.dayRow={spend,reach:Math.round(imp*(.72+r()*.12)),impressions:imp,clicks,unique_clicks:Math.round(clicks*.8),results:Math.round(clicks*(.4+r()*.3))};subDaily()},
  genDaily:el=>guard(el,async()=>{const r=await api("/admin/api/demo-generate","POST",{...S.gen});const c=S.acct.doc.campaigns[S.day.ci];Object.assign(c.daily,r.daily);loadDay();markDirty();subDaily();toast("Generated "+Object.keys(r.daily).length+" days")}),
  clearAllDays:()=>{if(confirm("Remove every daily number of this campaign?")){S.acct.doc.campaigns[S.day.ci].daily={};loadDay();markDirty();subDaily()}},
  /* wizard */
  wizClose:()=>{if(confirm("Close without saving this campaign?")){closeModal();W=null;REFRESH=()=>{}}},
  wizBack:()=>{if(W.step>0){W.step--;wizRender()}},
  wizNext:()=>{const e=wizCheck();if(e)return toast(e,"bad");W.step++;wizRender()},
  wizFinish:el=>guard(el,async()=>{
    const c=W.camp,a=c.adsets[0],ad=c.ads[0];a.name=(a.name||"").trim()||c.name;ad.name=(ad.name||"").trim()||c.name+" ad";c.name=c.name.trim();if(W.mode==="new"){delete ad.adset_id;c.created=todayIST()}
    if(W.gen.mode==="gen"){const r=await api("/admin/api/demo-generate","POST",{...W.gen});c.daily=W.mode==="new"?r.daily:Object.assign({},c.daily,r.daily)}
    const mode=W.mode;if(mode==="new")S.acct.doc.campaigns.push(c);else S.acct.doc.campaigns[W.idx]=c;
    await saveDoc();closeModal();W=null;REFRESH=()=>{};S.sub="campaigns";viewEditor();confetti();toast(mode==="new"?"Campaign created 🎉":"Campaign saved ✓")}),
  obj:el=>{W.camp.objective=el.dataset.v;W.camp.result_action=RESULT_BY_OBJ[el.dataset.v];wizRender()},
  setv:el=>{const v=el.dataset.v;setp(el.dataset.p,/^\d+$/.test(v)?+v:v);REFRESH()},
  closeEdit:()=>closeEditor(),
  toggleDetail:el=>{const i=+el.dataset.i;S.open[i]=!S.open[i];subCampaigns()},
  tog:el=>{const arr=getp(el.dataset.p),v=el.dataset.v,i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);REFRESH()},
  tagDel:el=>{getp(el.dataset.p).splice(+el.dataset.i,1);REFRESH()},
  addInterest:el=>{const a=getp(el.dataset.p);if(!a.includes(el.dataset.v))a.push(el.dataset.v);REFRESH()},
  autoPl:el=>{setp(el.dataset.p,el.checked);REFRESH()},
  sampleVideo:el=>{setp(el.dataset.p,S.sample);REFRESH()},
  genMode:el=>{W.gen.mode=el.dataset.v;wizRender()},
  /* ad sets and ads */
  asStatus:el=>{S.acct.doc.campaigns[+el.dataset.i].adsets[+el.dataset.k].status=el.checked?"ACTIVE":"PAUSED";markDirty();subCampaigns()},
  adStatus:el=>{S.acct.doc.campaigns[+el.dataset.i].ads[+el.dataset.k].status=el.checked?"ACTIVE":"PAUSED";markDirty();subCampaigns()},
  editAdset:el=>openEditor("adset",+el.dataset.i,+el.dataset.k),
  newAdset:el=>openEditor("adset",+el.dataset.i,-1),
  editAd:el=>openEditor("ad",+el.dataset.i,+el.dataset.k),
  newAd:el=>openEditor("ad",+el.dataset.i,-1),
  delAdset:el=>{const c=S.acct.doc.campaigns[+el.dataset.i];if(c.adsets.length<2)return toast("A campaign needs at least one ad set","bad");if(confirm("Delete this ad set? Its ads move to the first ad set.")){c.adsets.splice(+el.dataset.k,1);markDirty();subCampaigns()}},
  delAd:el=>{const c=S.acct.doc.campaigns[+el.dataset.i];if(confirm("Delete this ad?")){c.ads.splice(+el.dataset.k,1);markDirty();subCampaigns()}},
  saveEdit:el=>guard(el,async()=>{
    const e=S.edit,c=S.acct.doc.campaigns[S.editCi],neu=S.editIdx<0;
    if(S.editKind==="adset"){
      if(!(e.name||"").trim())e.name=c.name;
      if(!(e.daily_budget>0))throw new Error("Enter a daily budget");
      if(e.end_time&&e.end_time<e.start_time)throw new Error("End date must be after the start date");
      if(!e.countries.length)throw new Error("Add at least one country, for example IN");
      if(e.age_min>e.age_max)throw new Error("Minimum age cannot be above maximum age");
      if(neu)c.adsets.push(e);else c.adsets[S.editIdx]=e;
    }else{
      if(!(e.name||"").trim())e.name=c.name+" ad";
      if(e.video_url&&!/^https?:\/\//.test(e.video_url))throw new Error("The video link must start with https://");
      if(neu)c.ads.push(e);else c.ads[S.editIdx]=e;
    }
    await saveDoc();closeEditor();subCampaigns();toast(neu?"Added ✓":"Saved ✓")}),
  /* app control */
  saveMaint:el=>guard(el,async()=>{await api("/admin/api/maintenance","POST",{enabled:$("#m_on").checked,message:$("#m_msg").value});toast($("#m_on").checked?"Maintenance is ON":"Maintenance is OFF");await loadOverview()}),
  unblockAll:el=>guard(el,async()=>{const r=await api("/admin/api/unblock-all","POST",{});toast(r.unblocked+" device(s) unblocked")}),
};
const CHG={
  dayCamp:el=>{S.day.ci=+el.value;loadDay();subDaily()},
  dayDate:el=>{if(!el.value)return;S.day.date=el.value;loadDay();subDaily()},
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-chg]");if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener("keydown",e=>{
  const t=e.target.closest&&e.target.closest("[data-tagin]");if(!t)return;const path=t.dataset.tagin;
  const refocus=()=>{REFRESH();const n=$(`[data-tagin="${path}"]`);n&&n.focus()};
  if(e.key==="Enter"||e.key===","){e.preventDefault();let v=t.value.trim().replace(/,$/,"");if(!v)return;if(t.dataset.up){v=v.toUpperCase();if(v.length!==2)return toast("Use a 2-letter country code like IN","bad")}const arr=getp(path);if(!arr.includes(v))arr.push(v);refocus()}
  else if(e.key==="Backspace"&&!t.value){const arr=getp(path);if(arr.length){arr.pop();refocus()}}
});
(async function boot(){
  try{S.session=await (await fetch("/admin/api/session",{credentials:"same-origin"})).json()}catch(e){S.session={configured:true}}
  if(S.session.authed)await enter();else showLogin();
})();
</script>
